# ---------------------------------------------------------------------------
# QR ALTRIX — Nginx site configuration
#
# Replace qr.example.com with your domain, then:
#   ./scripts/init-ssl.sh qr.example.com you@example.com
#
# Custom short domains are served by the same blocks: add each one to the
# server_name list (./scripts/add-domain.sh does that for you), because the app
# resolves the host itself and only serves domains that are verified.
# ---------------------------------------------------------------------------

upstream qraltrix_app {
  server app:3000;
  keepalive 32;
}

# --- HTTP: ACME challenge, then redirect everything else to HTTPS ------------
server {
  listen 80;
  listen [::]:80;
  server_name qr.example.com;

  # Certbot writes its challenge files here.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS ------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name qr.example.com;

  ssl_certificate     /etc/letsencrypt/live/qr.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/qr.example.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:QRAltrixSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Uploaded PDFs and gallery images can be large; QR exports never are.
  client_max_body_size 32m;

  # ---- proxy defaults ------------------------------------------------------
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  # GeoIP module not required: set these from your CDN if you have one, and the
  # app will use them for the country/region/city breakdowns.
  # proxy_set_header X-GeoIP-Country-Code $geoip2_data_country_code;
  # proxy_set_header X-GeoIP-City         $geoip2_data_city_name;
  proxy_read_timeout 70s;
  proxy_buffering off;

  # ---- static assets -------------------------------------------------------
  location /_next/static/ {
    proxy_pass http://qraltrix_app;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /favicon.ico {
    proxy_pass http://qraltrix_app;
    add_header Cache-Control "public, max-age=86400";
  }

  # Uploaded files are immutable: their keys are random.
  location /api/files/ {
    proxy_pass http://qraltrix_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ---- scan redirects: the hot path, never rate limited --------------------
  location ~ ^/(q|r)/ {
    proxy_pass http://qraltrix_app;
    add_header Cache-Control "no-store" always;
  }

  # ---- auth endpoints: tighter limit --------------------------------------
  location ~ ^/api/auth/ {
    limit_req zone=qra_auth burst=10 nodelay;
    proxy_pass http://qraltrix_app;
  }

  # ---- public API ---------------------------------------------------------
  location /api/ {
    limit_req zone=qra_api burst=120 nodelay;
    proxy_pass http://qraltrix_app;
  }

  # ---- everything else ---------------------------------------------------
  location / {
    proxy_pass http://qraltrix_app;
  }

  # Domain-ownership proof for custom short domains.
  location = /.well-known/qr-altrix-domain-verification {
    proxy_pass http://qraltrix_app;
  }
}
