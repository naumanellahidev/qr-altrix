user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The scan short code is the interesting part of every access log line.
  log_format qraltrix '$remote_addr - $host "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log qraltrix;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 32m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types
    text/plain text/css text/javascript application/javascript application/json
    application/xml image/svg+xml application/manifest+json;

  # Rate limits are per client address and protect the auth and API surfaces. Scan
  # redirects are deliberately left unlimited: a popular poster is not an attack.
  limit_req_zone $binary_remote_addr zone=qra_auth:10m rate=12r/m;
  limit_req_zone $binary_remote_addr zone=qra_api:10m rate=240r/m;
  limit_req_status 429;

  # Trust the forwarded protocol when it is present (set by this proxy itself).
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
  }

  include /etc/nginx/conf.d/*.conf;
}
