name: CI

# The VPS redeploys from main within a minute of a push, so this runs on the same
# commits: a red tick here is the signal that the server is about to rebuild something
# broken. Pull requests are checked before they get that far.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Enough for `next build` and the Prisma client; no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      IP_HASH_SALT: ci-only-salt-0123456789
      APP_URL: http://localhost:3000
      SHORT_URL_BASE: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # Database-backed tests skip themselves unless DATABASE_URL points at a real
        # server, so this stays fast and hermetic.
        run: npm test

      - name: Production build
        run: npm run build

  integration:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qraltrix
          POSTGRES_PASSWORD: qraltrix
          POSTGRES_DB: qraltrix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://qraltrix:qraltrix@localhost:5432/qraltrix_test?schema=public
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      IP_HASH_SALT: ci-only-salt-0123456789
      APP_URL: http://localhost:3000
      SHORT_URL_BASE: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run the full suite against PostgreSQL
        run: npm test
