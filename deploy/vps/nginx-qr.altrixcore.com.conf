# ---------------------------------------------------------------------------
# QR ALTRIX — qr.altrixcore.com
#
# Reverse proxy to the app container on 127.0.0.1:3010 (docker-compose.vps.yml).
# Deployed by /opt/qraltrix/deploy.sh via qraltrix-autodeploy.timer.
#
# Install:
#   sudo cp nginx-qr.altrixcore.com.conf /etc/nginx/sites-available/qr.altrixcore.com.conf
#   sudo ln -s ../sites-available/qr.altrixcore.com.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/acme-qraltrix
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/acme-qraltrix -d qr.altrixcore.com
# ---------------------------------------------------------------------------

upstream qraltrix_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

# Scan redirects are the hot path and are never rate limited: a popular poster is not an
# attack. Sign-in and the API are limited per client address.
limit_req_zone $binary_remote_addr zone=qraltrix_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=qraltrix_api:10m rate=240r/m;

server {
    listen 80;
    listen [::]:80;
    server_name qr.altrixcore.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-qraltrix;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen … http2` rather than the newer `http2 on;`, which needs nginx 1.25.1+.
    # Ubuntu 24.04 ships 1.24, where the directive does not exist and nginx -t fails.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qr.altrixcore.com;

    ssl_certificate /etc/letsencrypt/live/qr.altrixcore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.altrixcore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PDFs, gallery images, audio and video uploads.
    client_max_body_size 32m;

    # --- shared proxy settings ---------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Unique-visitor hashing and rate limiting read this.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Makes the session cookie Secure and keeps absolute URLs on https.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    # Cloudflare already resolves the country; pass it through for analytics.
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_read_timeout 70s;
    proxy_buffering off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://qraltrix_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Upload keys are random, so the files are safe to cache hard.
    location /api/files/ {
        proxy_pass http://qraltrix_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The scan path: no limits, no caching.
    location ~ ^/(q|r)/ {
        proxy_pass http://qraltrix_app;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/auth/ {
        limit_req zone=qraltrix_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://qraltrix_app;
    }

    location /api/ {
        limit_req zone=qraltrix_api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://qraltrix_app;
    }

    location / {
        proxy_pass http://qraltrix_app;
    }
}
